<title>视效审美对齐</title>
<style>
  :root {
    --bg: #0e0f11;
    --raised: #17191c;
    --line: #2a2d32;
    --text: #e8e9eb;
    --muted: #8b9098;
    --accent: #3EC8FF;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
    overflow: hidden;
  }
  .app {
    height: 100dvh; height: 100svh;
    display: flex; flex-direction: column;
    padding-top: var(--safe-t);
  }
  header {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; white-space: nowrap; }
  .count { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fav-count { color: var(--accent); }
  .btns { display: flex; gap: 6px; flex-shrink: 0; }
  button, .chip {
    appearance: none; border: 1px solid var(--line); background: var(--raised);
    color: var(--text); border-radius: 999px; padding: 7px 10px; font-size: 12px;
    cursor: pointer; min-height: 32px;
  }
  button.primary { border-color: var(--accent); color: var(--accent); }
  button:active, .chip:active, .heart:active { transform: scale(.97); }
  .chips {
    display: flex; gap: 8px; padding: 8px 12px 6px;
    overflow-x: auto; flex: 0 0 auto; scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip { white-space: nowrap; }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .feed {
    flex: 1; overflow-y: auto; scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    padding-bottom: var(--safe-b);
  }
  .card {
    scroll-snap-align: start; scroll-snap-stop: always;
    height: 100%;
    min-height: 100%;
    display: flex; flex-direction: column;
    position: relative;
  }
  .stage {
    flex: 1; min-height: 0; background: #000;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .stage img {
    max-width: 100%; max-height: 100%; width: auto; height: auto;
    object-fit: contain; display: block;
    pointer-events: none;
  }
  .meta {
    flex: 0 0 auto;
    padding: 10px 16px calc(14px + var(--safe-b));
    display: grid; grid-template-columns: 1fr 56px; gap: 4px 12px;
    align-items: center;
    background: linear-gradient(180deg, transparent, var(--bg) 18%);
  }
  .title { font-size: 16px; font-weight: 600; line-height: 1.3; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .heart {
    width: 52px; height: 52px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--raised);
    color: var(--text); cursor: pointer;
    display: grid; place-items: center; justify-self: end;
  }
  .heart.on { border-color: var(--accent); color: var(--accent); background: #123040; }
  a { color: var(--accent); text-decoration: none; }
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + var(--safe-b));
    transform: translateX(-50%) translateY(20px);
    background: #222; color: var(--text); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 14px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: .2s ease;
    z-index: 10;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

    </div>
  </header>
  <div class="chips" id="chips"></div>
  <div class="feed" id="feed" tabindex="0"></div>
</div>

const KEY = 'design-research-aesthetic-fav-v1';
const feed = document.getElementById('feed');
const chips = document.getElementById('chips');
const toast = document.getElementById('toast');
let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) { favs = new Set(); }
let filter = 'all';
let onlyFav = false;

const channels = [...new Set(ITEMS.map(i => i.channel))];
function paintChips() {
  const all = [{id:'all', label:'全部'}].concat(channels.map(c => ({id:c, label:c})));
  chips.innerHTML = all.map(c => `<button type="button" class="chip" data-id="${c.id}" aria-pressed="${filter===c.id}">${c.label}</button>`).join('');
}
paintChips();
chips.addEventListener('click', (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  filter = b.dataset.id; onlyFav = false;
  document.getElementById('onlyFav').textContent = '只看收藏';
  paintChips(); render();
});

function visible() {
  return ITEMS.filter(i => (filter==='all' || i.channel===filter) && (!onlyFav || favs.has(i.id)));
}

function heartSvg(on) {
  return on
    ? '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-6.7-4.35-9.33-8.2C.8 10.05 1.2 6.7 4.1 5.3 6.3 4.25 8.7 5 12 8.1c3.3-3.1 5.7-3.85 7.9-2.8 2.9 1.4 3.3 4.75 1.43 7.5C18.7 16.65 12 21 12 21z"/></svg>'
    : '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12.1 20.3S4.5 15.2 2.4 11.3C.7 8.2 1.6 4.9 4.8 3.9c2.2-.7 4.3.4 5.8 2.3 1.5-1.9 3.6-3 5.8-2.3 3.2 1 4.1 4.3 2.4 7.4-2.1 3.9-9.7 9-9.7 9z"/></svg>';
}

function render() {
  const list = visible();
  document.getElementById('total').textContent = String(list.length);
  document.getElementById('favn').textContent = String(favs.size);
  feed.innerHTML = list.map((i, idx) => `
    <article class="card" data-id="${i.id}" data-idx="${idx}">
      <div class="stage"><img loading="lazy" decoding="async" alt="${escapeAttr(i.title)}" src="${i.preview}" /></div>
      <div class="meta">
        <div>
          <div class="title">${escapeHtml(i.title)}</div>
          <div class="sub">${escapeHtml(i.channel)} · ${escapeHtml(i.section)} · <a href="${i.url}" target="_blank" rel="noopener">打开原页</a></div>
        </div>
        <button type="button" class="heart ${favs.has(i.id)?'on':''}" data-fav="${i.id}" aria-label="收藏">${heartSvg(favs.has(i.id))}</button>
      </div>
    </article>`).join('');
  updatePos();
  if (list.length) feed.scrollTo(0,0);
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));}
function escapeAttr(s){return escapeHtml(s).replace(/`/g,'');}

function toggleFav(id){
  if (favs.has(id)) favs.delete(id); else favs.add(id);
  localStorage.setItem(KEY, JSON.stringify([...favs]));
  document.getElementById('favn').textContent = String(favs.size);
  const btn = feed.querySelector('[data-fav="' + CSS.escape(id) + '"]');
  if (btn){ btn.classList.toggle('on', favs.has(id)); btn.innerHTML = heartSvg(favs.has(id)); }
  if (onlyFav) render();
}

feed.addEventListener('click', (e) => {
  const b = e.target.closest('[data-fav]');
  if (b) toggleFav(b.dataset.fav);
});
feed.addEventListener('dblclick', (e) => {
  const card = e.target.closest('.card');
  if (card && e.target.closest('.stage')) toggleFav(card.dataset.id);
});

function currentCard(){
  const cards = [...feed.querySelectorAll('.card')];
  const y = feed.scrollTop;
  let best = cards[0], d = Infinity;
  for (const c of cards){
    const dd = Math.abs(c.offsetTop - y);
    if (dd < d){ d = dd; best = c; }
  }
  return best;
}
function updatePos(){
  const c = currentCard();
  if (c) document.getElementById('pos').textContent = String(Number(c.dataset.idx)+1);
}
feed.addEventListener('scroll', () => { window.requestAnimationFrame(updatePos); }, {passive:true});

document.getElementById('onlyFav').addEventListener('click', (e) => {
  onlyFav = !onlyFav;
  e.currentTarget.textContent = onlyFav ? '看全部' : '只看收藏';
  render();
});

function picked(){
  return ITEMS.filter(i => favs.has(i.id));
}

document.getElementById('copyFav').addEventListener('click', async () => {
  const payload = JSON.stringify({savedAt: new Date().toISOString(), count: favs.size, items: picked()}, null, 2);
  try {
    await navigator.clipboard.writeText(payload);
    showToast('已复制 ' + favs.size + ' 条收藏，发回给我就行');
  } catch (err) {
    const ta = document.createElement('textarea');
    ta.value = payload; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    showToast('已复制 ' + favs.size + ' 条收藏，发回给我就行');
  }
});

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 1800);
}

document.addEventListener('keydown', (e) => {
  if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  const c = currentCard();
  if ((e.key==='f' || e.key==='F' || e.key==='l' || e.key==='L') && c){ e.preventDefault(); toggleFav(c.dataset.id); }
  if (e.key==='ArrowDown' || e.key==='j' || e.key==='J'){ e.preventDefault(); c?.nextElementSibling?.scrollIntoView({behavior:'smooth'}); }
  if (e.key==='ArrowUp' || e.key==='k' || e.key==='K'){ e.preventDefault(); c?.previousElementSibling?.scrollIntoView({behavior:'smooth'}); }
});

render();
</script>
